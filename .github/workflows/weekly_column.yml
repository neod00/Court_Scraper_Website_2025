name: Weekly Column (auto)

# 주간 칼럼 자동 작성·검증·발행.
# 금요일 밤(weekly_ai_report.yml)에 만들어진 weekly_reports 행을 바탕으로
# 토요일 오전 scripts/write_weekly_column.py --auto 를 실행합니다.
# 끄는 방법: 저장소 Variables 에 AUTO_PUBLISH_DISABLED=true 를 두거나 이 워크플로를 비활성화합니다.

on:
  schedule:
    # 매주 토요일 00:30 UTC = 09:30 KST (금 23:00 KST 주간 집계 행 생성 이후)
    - cron: '30 0 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: '대상 주차 week_start (YYYY-MM-DD, 월요일). 비우면 자동 선택'
        required: false
        type: string
        default: ''
      dry_run:
        description: '생성·검증만 하고 저장하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-column
  cancel-in-progress: false

jobs:
  write-column:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Write weekly column (auto)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_PUBLISH_DISABLED: ${{ vars.AUTO_PUBLISH_DISABLED }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--auto)
          if [ -n "${INPUT_WEEK}" ]; then
            if ! [[ "${INPUT_WEEK}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "week 입력 형식 오류: YYYY-MM-DD 가 필요합니다." >&2
              exit 1
            fi
            args+=(--week "${INPUT_WEEK}")
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          echo "실행: python scripts/write_weekly_column.py ${args[*]}"
          python scripts/write_weekly_column.py "${args[@]}"

      - name: Upload failed drafts (guard rejected)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-column-auto-failed
          path: drafts/weekly-columns/*.auto-failed.md
          if-no-files-found: ignore
          retention-days: 30
