name: Monthly Report (auto)

# 월간 리포트 자동 발행.
# - 매월 2일: 직전 달 집계(src/content/reports/YYYY-MM.json) 생성 → 노트 자동 작성·검증 → 발행
# - 매주 일요일: 아직 발행되지 않은 가장 오래된 과거 달을 1편만 발행 (백필 속도 제한)
# 결과 JSON 과 index.ts 를 커밋·푸시하면 사이트가 재배포됩니다.
# 끄는 방법: 저장소 Variables 에 AUTO_PUBLISH_DISABLED=true 를 두거나 이 워크플로를 비활성화합니다.

on:
  schedule:
    # 매월 2일 01:00 UTC = 10:00 KST — 직전 달 발행
    - cron: '0 1 2 * *'
    # 매주 일요일 01:00 UTC = 10:00 KST — 미발행 과거 달 1편
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      month:
        description: '대상 월 (YYYY-MM). 비우면 미발행 과거 달 중 가장 오래된 달'
        required: false
        type: string
        default: ''
      dry_run:
        description: '노트 생성·검증만 하고 파일을 쓰거나 커밋하지 않음'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-report
  cancel-in-progress: false

jobs:
  publish-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Build and publish monthly report (auto)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AUTO_PUBLISH_DISABLED: ${{ vars.AUTO_PUBLISH_DISABLED }}
          INPUT_MONTH: ${{ inputs.month }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_MONTH}" ]; then
            if ! [[ "${INPUT_MONTH}" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
              echo "month 입력 형식 오류: YYYY-MM 이 필요합니다." >&2
              exit 1
            fi
            args=(--auto-publish "${INPUT_MONTH}")
          elif [ "${EVENT_NAME}" = "schedule" ] && [ "${EVENT_SCHEDULE}" = "0 1 2 * *" ]; then
            prev_month=$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)
            args=(--auto-publish "${prev_month}")
          elif [ "${EVENT_NAME}" = "schedule" ] && [ "$(date -u +%d)" = "02" ]; then
            # 2일이 일요일이면 두 스케줄이 같은 날 실행됩니다. 하루 1편 원칙에 따라 일요일 백필 실행은 건너뜁니다.
            echo "오늘은 2일이므로 직전 달 발행 실행에 맡기고 일요일 백필 실행은 건너뜁니다."
            exit 0
          else
            args=(--auto-next)
          fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then
            args+=(--dry-run)
          fi
          echo "실행: python scripts/monthly_report_builder.py ${args[*]}"
          python scripts/monthly_report_builder.py "${args[@]}"

      - name: Commit and push report files
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          git config user.name "lawauction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/reports
          if git diff --cached --quiet; then
            echo "변경된 리포트 파일이 없습니다. 커밋을 건너뜁니다."
            exit 0
          fi
          git commit -m "content(report): auto-publish $(date -u +%F)"
          # 실행 중 다른 푸시가 있었으면 한 번 rebase 후 재시도
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
